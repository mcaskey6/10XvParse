# Gene-body coverage tooling: gffread (GTF -> BED), samtools (BAM index), and
# RSeQC's geneBody_coverage.py.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - rseqc=5.0.4
  - r-base       # geneBody_coverage.py shells out to Rscript for its plot; some
                 # rseqc builds don't pull R, so require it explicitly
  - gffread=0.12.7
  - samtools=1.21
