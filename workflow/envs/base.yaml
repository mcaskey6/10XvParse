# Small utilities used by the download / unzip / read-counting / Python-script rules
# (curl fetches, gunzip/zcat, awk/sed text munging, and the `script:` rules that run
# workflow/scripts/*.py — which import only the standard library + parse_config).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - curl     # unpinned: exact old curl pins get dropped from conda-forge; any works
  - gzip
  - gawk
  - sed
  - coreutils
