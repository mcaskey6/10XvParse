name: e2e

# Runs the tiny synthetic end-to-end test of the Snakemake workflow on every push
# and pull request. No network/SRA access is needed: the reference and reads are
# generated locally by Tests/generate_test_data.py.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # login shell so the conda env is active in each step
    steps:
      - uses: actions/checkout@v4

      - name: Set up test environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: Tests/ci-env.yml
          cache-environment: true

      - name: Run end-to-end test
        run: bash Tests/run_e2e.sh
