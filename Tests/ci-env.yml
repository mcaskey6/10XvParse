# Conda environment for the end-to-end CI test (Tests/run_e2e.sh). This is a
# minimal, test-only env — not the full analysis environment. It carries just the
# tools the Tier-1 pipeline exercises: Snakemake, the kb/kallisto/bustools counter,
# splitcode, seqtk, pigz, plus anndata for the output check. STAR / gffread / RSeQC
# / sra-tools are intentionally omitted (gene-body coverage and downloads aren't
# tested here).
name: xvp-ci
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake-minimal
  - kb-python
  - kallisto
  - bustools
  - splitcode
  - seqtk
  - pigz
  - pyyaml
  - anndata
  - scipy
