# Conda environment for the end-to-end CI test (Tests/run_e2e.sh). This is a
# test-only env — not the full analysis environment. It carries the tools the test
# exercises: Snakemake, the kb/kallisto/bustools counter, splitcode, seqtk, pigz, and
# the gene-body-coverage tools (STAR, samtools, gffread, RSeQC), plus anndata for the
# output check. sra-tools is omitted (the test uses only local reads, no downloads).
name: xvp-ci
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake-minimal
  - kb-python
  - kallisto
  - bustools
  - splitcode
  - seqtk
  - pigz
  - star
  - samtools
  - gffread
  - rseqc
  - pyyaml
  - anndata
  - scipy
