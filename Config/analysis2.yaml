# The suffix for the R1 and R2 FASTA files dumped from fasterq-dump. For some reason these change across datasets
read_num:
  10x:
    R1: 3
    R2: 4
  10x_hashtags:
    R1: 3
    R2: 4
  parse:
    R1: 1
    R2: 2
  parse_mini:
    R1: 1
    R2: 2

# Files to generate the kallisto index
species: mouse

# The kb-python technology strings
tech:
 10x: 10XV3
 10x_hashtags: 10XV3
 parse: WT_v2
 parse_mini: WT_mini_v2

 wells:
  parse: [C7, C8, C9, C10, C11, C12, D1, D2]

# Two subsample depths (analysis2.py's standard/mini): the same 10x assay is
# subsampled once against parse (WT) and once against parse_mini, each to that
# group's shared minimum. The tag names the depth; it flows onto every sampled
# output of the group (Sampled_<tag>/, subsample_num_<tag>.txt, sampled_*_<tag>_out).
# The 10x_hashtags assay is not subsampled (single full-depth kite count).
comparisons:
 - tag: standard
   tenx: [10x]
   parse: [parse]
 - tag: mini
   tenx: [10x]
   parse: [parse_mini]