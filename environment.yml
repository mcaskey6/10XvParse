# Conda environment for the 10XvParse workflow and its analysis notebooks.
#
# Responsibilities are split:
#   * conda (below) provides Snakemake and the command-line tools the workflow calls,
#     so it runs without `--use-conda`. (With `--use-conda`, Snakemake instead builds
#     the per-rule environments in workflow/envs/, and only snakemake + a conda
#     frontend are strictly needed here.)
#   * `pip install -e .` installs the XvP_utils package together with its Python
#     dependencies (declared in pyproject.toml) — the plotting/analysis helpers the
#     notebooks in Notebooks/ import.
#
# Create with:
#   conda env create -f environment.yml
#   conda activate 10XvParse
#
# Tool versions are pinned to match the per-rule envs in workflow/envs/. R is kept out
# of this env on purpose: the notebooks' goseq GO enrichment (and edgeR/limma/
# EnhancedVolcano) run in a SEPARATE R env — create it from envs/edgeR.yaml. Keeping R
# out here is what lets XvP_utils' goseq resolver avoid picking a goseq-less Rscript.
name: 10XvParse
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip

  # Snakemake + the command-line tools the workflow rules call.
  - snakemake-minimal>=9
  - kb-python=0.29.3
  - kallisto=0.51.1
  - bustools=0.44.1
  - splitcode=0.30.0
  - seqtk=1.2
  - pigz
  - sra-tools=3.0.3
  - star=2.7.11b
  - samtools=1.21
  - gffread=0.12.7
  - rseqc=5.0.4
  - curl

  # Notebook kernel (VS Code / Jupyter run the notebooks in this env).
  - ipykernel

  # XvP_utils + its Python dependencies (anndata, scanpy, pandas, numpy, ... — see
  # pyproject.toml). Installed editable so local edits to the package take effect.
  - pip:
      - -e .
