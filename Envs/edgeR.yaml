# R analysis environment, kept SEPARATE from the main 10XvParse env on purpose:
# XvP_utils/cross_comparison.py runs goseq GO enrichment through Rscript, and its
# resolver (_resolve_rscript) looks for an Rscript that can load goseq — in an
# explicit `rscript=`, then $XVP_RSCRIPT, then PATH, then sibling conda envs. Keeping
# R here (not in 10XvParse, whose Rscript would otherwise be found first without
# goseq) is what makes that resolution reliable.
#
# Create with:
#   conda env create -f Envs/edgeR.yaml
# then point XvP at it (or rely on the sibling-env search):
#   export XVP_RSCRIPT=$CONDA_PREFIX/../edgeR/bin/Rscript
#
# Covers the notebooks' R work: goseq (GO enrichment), edgeR + limma (differential
# expression), EnhancedVolcano, and biomaRt. Transitive deps (GO.db, genelendatabase,
# AnnotationDbi, ...) are resolved by conda.
name: edgeR
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.5.3
  - bioconductor-goseq=1.62.0
  - r-biasedurn=2.0.12
  - bioconductor-edger=4.8.2
  - bioconductor-limma=3.66.0
  - bioconductor-enhancedvolcano=1.28.2
  - bioconductor-biomart=2.66.1
