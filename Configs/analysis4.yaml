name: Analysis_4

ERA:
  10x:
  - ERR12398015
  parse:
    sub1:
    - ERR12167397
    sub2:
    - ERR12167398

# ENA files arrive as _1.fastq.gz / _2.fastq.gz
read_num:
  10x:
    R1: 2
    R2: 1
  parse:
    R1: 1
    R2: 2
    # ERR12167397 (sub1) was uploaded with the barcode read on _1 rather than _2,
