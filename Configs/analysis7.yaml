name: Analysis_7

# Pre-downloaded local reads (no SRA/ERA download). Each assay lists its libraries
# as [R1_file, R2_file] pairs (R1/R2 in the assay's read order); the files live in
# that assay's FASTA/Dumped dir and are used by name, so any filenames work (e.g.
# Illumina *_R1_001.fastq.gz) with no renaming. Each pair is one Parse sublibrary,
# in the order listed (barcode-assignment order).
local:
 10x:
 - [Lib0_1.fastq.gz, Lib0_2.fastq.gz]
 10x_hashtags:
 - [Lib0_1.fastq.gz, Lib0_2.fastq.gz]
 parse:
 - [Lib0_1.fastq.gz, Lib0_2.fastq.gz]
 - [Lib1_1.fastq.gz, Lib1_2.fastq.gz]

# The suffix for the R1 and R2 FASTA files dumped from fasterq-dump. For some reason these change across datasets
read_num:
  10x:
    R1: 1
    R2: 2
  10x_hashtags:
    R1: 1
    R2: 2
  parse:
    R1: 1
    R2: 2

# Files to generate the kallisto index
species: human

# kit name
tech:
 10x: 10XV4
 10x_hashtags: 10XV4
 parse: WT_mini_v3

# Optional R2 trim lengths (bp) for feature barcode libraries.
# Multi-seq 8-mer barcodes need trimming because the downstream poly-A -> genomic
# sequence transition creates k-mers that collide with kite index entries from
# other barcodes, dropping pseudoalignment
trim:
 10x_hashtags: 8

# No SRA/ERA block: reads are pre-downloaded local files (Lib{i}_{read}.fastq.gz
# in each assay's FASTA/Dumped dir), discovered by the local source path.
# One untagged subsample group (10x vs parse); 10x_hashtags is not subsampled.
comparisons:
 - tag: ""
   tenx: [10x]
   parse: [parse]